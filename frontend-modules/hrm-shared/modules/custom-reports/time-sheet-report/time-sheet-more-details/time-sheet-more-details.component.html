<div class="flex flex-row w-full  p-5" [style]="{'height':'72vh','overflow-y':'scroll'}">
    <div class="flex flex-column bg-white shadow-lg rounded-lg ">
        <div class="flex flex-row justify-content-between align-items-center p-3">
            <div class=" flex flex-column">
                <h2 class="text-2xl font-semibold text-gray-800 ">More Details</h2>
                <p class="text-gray-600">
                    Here you can see all the Employee details effectively.
                </p>
            </div>
            <div class="flex-column">
                <i class="pi pi-times-circle cursor-pointer" style="font-size: 1.5rem" (click)="onCloseMoreDetails()"></i>
                
            </div>
        </div>
        <div class=" flex flex-column align-items-center  bg-white shadow-lg rounded-lg">
            <p-accordion [activeIndex]="[0,1,2]" [multiple]="true" class="w-full">

                <p-accordionTab header="General Details" class="hover:bg-blue-50">
                    <div class="flex flex-row flex-wrap gap-4 ">
                        <div class="flex flex-column ">
                            <label for="employe_type">Employee Type</label>
                            <input 
                                pInputText 
                                [readonly]="true"
                                id="employe_type" 
                                [value]="employeeDetails?.employee_type"
                        
                          />
                        </div>
                        <div class="flex flex-column ">
                            <label for="employee_group">Employee Group</label>
                            <input 
                                pInputText 
                                [readonly]="true"
                                id="employee_group" 
                             
                                [value]="employeeDetails?.employee_group"
                          />
                        </div>
                        <div class="flex flex-column ">
                            <label for="designation">Designation</label>
                            <input 
                                pInputText 
                                [readonly]="true"
                                id="designation" 
                            
                                [value]="employeeDetails?.designation_name"
                                
                          />
                        </div>
                        <div class="flex flex-column ">
                            <label for="shift">Shift</label>
                            <input 
                                pInputText 
                                [readonly]="true"
                                id="shift" 
                                [value]="moreDetails?.shift"
                               
                          />
                        </div>
                        <div class="flex flex-column ">
                            <label for="shift_in">Shift in</label>
                            <input 
                                pInputText 
                                [readonly]="true"
                                id="shift_in" 
                                [value]="moreDetails?.shift_in"
                          />
                        </div>
                        <div class="flex flex-column ">
                            <label for="shift_out">shift Out</label>
                            <input 
                                pInputText 
                                [readonly]="true"
                                id="shift_out" 
                                [value]="moreDetails?.shift_out"
                          />
                        </div>
             
                    </div>
                </p-accordionTab>
                
                <p-accordionTab header="Overtime Details" class="hover:bg-blue-50">
                    <div class="flex flex-row flex-wrap gap-4">
                        <div class="flex flex-column ">
                            <label for="permitted_ot">OT Adjustment</label>
                            <input 
                                pInputText 
                                id="converted_permitted_ot" 
                                (change)="onChagePermittedOT($event)"
                                [(ngModel)]="moreDetails.converted_permitted_ot"
                          />
                          <!-- [readonly]="true" -->
                        </div>
                        <div class="flex flex-column ">
                            <label for="permitted_ot">Remarks</label>
                            <textarea 
                            rows="5"
                            cols="50" 
                            pInputTextarea 
                            [(ngModel)]="moreDetails.remarks">
                        </textarea>
                        </div>
                        <!-- <div class="flex flex-column ">
                            <label for="scheduled_ot">Scheduled OT</label>
                            <input 
                                pInputText 
                                [readonly]="true"
                                id="scheduled_ot" 
                                [value]="moreDetails?.scheduled_ot"
                          />
                        </div> -->
                        </div>
                        </p-accordionTab>
            </p-accordion>
        </div>
    </div>
</div>
<div class="flex flex-row justify-content-center gap-2 align-items-center">
    <button pButton pRipple icon="pi pi-times" class=" p-button-danger font-semibold" label="Cancel" (click)="onCloseMoreDetails()"
    ></button>
    <button pButton pRipple icon="pi pi-check" class=" p-button-success  font-semibold" label="Apply" (click)="saveAttendanceDetails()"
    ></button>
</div>
