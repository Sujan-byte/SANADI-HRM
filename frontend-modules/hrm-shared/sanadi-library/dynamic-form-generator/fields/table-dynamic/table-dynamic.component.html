<p-table #tb [value]="field?.list" [paginator]="field?.paginator" [rows]="field?.rows ? field?.rows : 10" dataKey="id"
    [(selection)]="selectedArray" [scrollable]="field?.scrollable"
    [scrollHeight]="field?.scrollHeight ? field?.scrollHeight : '65vh'" (onRowSelect)="onRowSelect($event)"
    (onRowUnselect)="onRowUnselect($event)" [globalFilterFields]="field?.formInitialise" [columns]="field?.columnSchema"
    [lazy]="field?.lazy ? field?.lazy : false" [style]="{ 'font-size' : '10.5px', 'width' : field?.width ?? '95.5vw'}"
    (onHeaderCheckboxToggle)="onSelectAllData($event)" [loading]="loading" [totalRecords]="totalRecords"
    (onLazyLoad)="nextPage($event, this.field?.queryParams)" styleClass="p-datatable-gridlines p-datatable-sm"
    [showCurrentPageReport]="true" [resizableColumns]="true" columnResizeMode="expand">
    <ng-template pTemplate="caption" *ngIf="field?.tableCaption">
        <p>{{field?.tableCaptionLabel ? field?.tableCaptionLabel : ''}}</p>
        <div snLayout="row" snLayoutAlign="space-between">
            <span class="p-input-icon-left" *ngIf="!field?.searchHide">
                <i class="pi pi-search"></i>
                <input pInputText type="text" [ngModel]="searchText" (ngModelChange)="globalSearch($event, tb)"
                    placeholder="{{ 'search_TC' | translate}}" />
            </span>
        </div>
    </ng-template>
    <ng-template pTemplate="header" let-columns>
        <tr>
            <!-- <th pFrozenColumn [style]="{'width': '10px'}">
                <p-tableHeaderCheckbox id="headerCheckbox" name="headerCheckbox" [disabled]="isCheckBoxDisabled()"
                    [ngStyle]="{ 'cursor': disableCheckBoxHeader ? 'not-allowed' : 'pointer' }"></p-tableHeaderCheckbox>
            </th> -->
            <ng-container *ngFor="let col of columns">
                <th [pSortableColumn]="col?.field" [style]="{'width': col?.colWidth}">
                    {{ col?.name | translate }}
                    <p-columnFilter #filter [field]="col?.field" display="menu"
                        *ngIf="!col?.hidefilterColumn && field?.lazy" matchMode="istartswith"
                        [matchModeOptions]="matchModeOption" appendTo="body" hideOnClear="true"
                        modal="true"></p-columnFilter>
                </th>
            </ng-container>

        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData let-item>
        <tr pSelectableRowDisabled="true">
            <!-- <td pFrozenColumn [style]="{'width': '10px'}">
                <p-tableCheckbox id="checkbox" name="checkbox" [disabled]="item[field?.disabledField]"
                    [ngStyle]="{ 'cursor': item[field?.disabledField] ? 'not-allowed' : 'pointer' }"
                    [value]="item"></p-tableCheckbox>
            </td> -->
            <ng-container *ngFor="let schema of field?.formSchema; let i = index;">
                <td [pEditableColumn]="(dataSource)" [ngClass]="{'frozen-column-data': schema?.frozen}"
                    [style.backgroundColor]="schema.color" [style.color]="'black'" [ngStyle]="{'left': schema?.left}"
                    *ngIf="!schema?.hidden">
                    {{item[schema?.name]}}
                </td>
            </ng-container>
            <!-- <ng-container *ngFor="let row of field?.formInitialise">
                <td>{{item[row]}}</td>
            </ng-container> -->
        </tr>
    </ng-template>
</p-table>
