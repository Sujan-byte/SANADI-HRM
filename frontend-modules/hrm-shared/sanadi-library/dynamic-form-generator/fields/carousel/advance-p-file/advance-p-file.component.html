<!-- accept=".jpg,.png,.jpeg,.pdf,.xlsx,.doc,.docx" -->
<!-- (contextmenu)="onOpenImageContext($event, selectedFiles)" -->
<div class="card p-1">
    <p-toast />
    <p-fileUpload #fp name="uploadFile[]" customUpload="true" (uploadHandler)="myUploader($event)" [multiple]="true"
        maxFileSize="5000000" (onClear)="onClearTemplatingUpload($event)" (onSelect)="onSelectedFiles($event)"
        [files]="selectedFiles">
        <ng-template pTemplate="header" let-files let-chooseCallback="chooseCallback" let-clearCallback="clearCallback"
            let-uploadCallback="uploadCallback">
            <div class="flex flex-wrap justify-content-between align-items-center flex">
                <div class="flex gap-1">
                    <p-button (onClick)="choose($event, chooseCallback)" icon="pi pi-images" [rounded]="true"
                        [outlined]="true" />
                    <p-button (onClick)="uploadEvent(uploadCallback)" icon="pi pi-cloud-upload" [rounded]="true"
                        [outlined]="true" severity="success" [disabled]="!files || files.length === 0" />
                    <p-button (onClick)="clearCallback()" icon="pi pi-times" [rounded]="true" [outlined]="true"
                        severity="danger" [disabled]="!files || files.length === 0" />
                </div>
                <p-progressBar [value]="totalSizePercent" [showValue]="false"
                    styleClass="md:w-20rem h-1rem w-full md:ml-auto"
                    [ngClass]="{ 'exceeded-progress-bar': totalSizePercent > 100 }">
                    <span class="white-space-nowrap">{{ totalSize }}B / 1Mb</span>
                </p-progressBar>
            </div>
        </ng-template>
        <ng-template pTemplate="content" let-files let-uploadedFiles="uploadedFiles"
            let-removeFileCallback="removeFileCallback" let-removeUploadedFileCallback="removeUploadedFileCallback">
            <div *ngIf="!files.length">
                <div class="flex align-items-center justify-content-center flex-column">
                    <i class="pi pi-cloud-upload border-2 border-circle p-5 text-8xl text-400 border-400"></i>
                    <p class="mt-4 mb-0">Drag and drop files here to upload.</p>
                </div>
            </div>
            <div *ngIf="files?.length > 0">
                <div class="flex flex-wrap sm:p-1 gap-5 w-full">
                    <div #img *ngFor="let file of files; let i = index"
                        class="flex flex-row border-1 justify-content-start surface-border border-round-2xl align-items-center gap-4 max-h-21rem p-2 shadow-1"
                        style="width: 31%;" (contextmenu)="onContextMenu($event, file)">
                        <div>
                            <ng-container *ngIf="isImage(file); else defaultFileIcon">
                                <img role="presentation" [alt]="file.name" [src]="file.objectURL" width="100%"
                                    height="100%" class="max-h-21rem"
                                    onerror="if (this.src != 'error.jpg') this.src = '/assets/images/image_not_found.png'" />
                            </ng-container>
                            <ng-template #defaultFileIcon>
                                <img role="presentation" [src]="getDefaultIcon(file)" alt="{{ file.name }}" width="100"
                                    height="100"
                                    onerror="if (this.src != 'error.jpg') this.src = '/assets/images/image_not_found.png'" />
                            </ng-template>
                        </div>
                        <div class="flex flex-column justify-content-center align-items-center gap-4">
                            <span class="font-semibold" style="word-break: break-all;">{{ file.name }}</span>
                            <div>{{ formatSize(file.size) }}</div>
                            <p-badge value="SUCCESS" severity="success" />
                            <p-button icon="pi pi-times" (click)="onRemoveTemplatingFile($event, file, index)"
                                [outlined]="true" [rounded]="true" severity="danger" />
                        </div>
                        <p-contextMenu [target]="img" [model]="imageOptions" appendTo="body" autoZIndex="true"
                            (onHide)="onHideImageContext()" />
                    </div>
                </div>
            </div>
        </ng-template>
        <ng-template pTemplate="file"></ng-template>
    </p-fileUpload>
</div>
