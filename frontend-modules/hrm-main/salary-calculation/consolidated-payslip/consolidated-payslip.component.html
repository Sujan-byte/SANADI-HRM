<div class="cp-wrapper">

  <!-- ── Filter / Toolbar Bar ── -->
  <div class="cp-filters">
    <div class="filter-row">

      <div class="filter-group">
        <label>Year</label>
        <p-dropdown
          [options]="yearOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="year()"
          (ngModelChange)="year.set($event)"
          placeholder="Year"
          styleClass="cp-dropdown">
        </p-dropdown>
      </div>

      <div class="filter-group">
        <label>Month</label>
        <p-dropdown
          [options]="months"
          optionLabel="label"
          optionValue="value"
          [ngModel]="month()"
          (ngModelChange)="month.set($event)"
          placeholder="Month"
          styleClass="cp-dropdown">
        </p-dropdown>
      </div>

      <div class="filter-group">
        <label>Group By</label>
        <p-dropdown
          [options]="groupByOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="groupBy()"
          (ngModelChange)="groupBy.set($event)"
          placeholder="Group By"
          styleClass="cp-dropdown">
        </p-dropdown>
      </div>

      <div class="filter-group col-picker-group">
        <label>Select Columns</label>
        <p-multiSelect
          [options]="allColumns"
          optionLabel="header"
          optionValue="field"
          [ngModel]="selectedFields()"
          (ngModelChange)="selectedFields.set($event)"
          placeholder="Select columns"
          selectedItemsLabel="{0} columns selected"
          [maxSelectedLabels]="0"
          styleClass="cp-multiselect"
          appendTo="body">
        </p-multiSelect>
      </div>

      <div class="filter-actions">
        <button pButton icon="pi pi-search" label="Apply"
          class="p-button-sm primary"
          (click)="applyFilters()"
          [disabled]="loading()">
        </button>
        <button pButton icon="pi pi-file-excel" label="Excel"
          class="p-button-sm excel-btn"
          pTooltip="Export to Excel" tooltipPosition="top"
          [disabled]="exporting() || rows().length === 0"
          (click)="exportExcel()">
        </button>
        <button pButton icon="pi pi-file-pdf" label="PDF"
          class="p-button-sm pdf-btn"
          pTooltip="Export to PDF" tooltipPosition="top"
          [disabled]="exporting() || rows().length === 0"
          (click)="exportPdf()">
        </button>
        <span class="cp-count" *ngIf="rows().length > 0">{{ rows().length }} record(s)</span>
      </div>

    </div>
  </div>

  <!-- ── Table ── -->
  <div class="cp-table-wrapper">

    <div *ngIf="loading()" class="cp-loading">
      <p-progressSpinner strokeWidth="4" styleClass="cp-spinner"></p-progressSpinner>
      <span>Loading...</span>
    </div>

    <p-table *ngIf="!loading()"
      [value]="rows()"
      [scrollable]="true"
      scrollHeight="flex"
      [resizableColumns]="true"
      styleClass="p-datatable-sm p-datatable-gridlines"
      [rowHover]="true">

      <ng-template pTemplate="header">
        <tr>
          <th *ngFor="let col of visibleColumns()" pResizableColumn class="cp-th">
            {{ col.header }}
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row>
        <tr>
          <td *ngFor="let col of visibleColumns()" class="cp-td">
            {{ row[col.field] ?? '' }}
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="visibleColumns().length || 1" class="cp-empty">
            <div class="cp-empty-inner">
              <i class="pi pi-inbox cp-empty-icon"></i>
              <span>No payslip records found. Select year &amp; month, then click Apply.</span>
            </div>
          </td>
        </tr>
      </ng-template>

    </p-table>
  </div>

</div>
